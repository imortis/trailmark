[project]
name = "trailmark"
version = "0.1.0"
description = "A code graph on HydraDB that learns from every agent run"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dense = ["fastembed>=0.4"]
bench = ["pyarrow>=15", "matplotlib>=3.8"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
trailmark = "trailmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trailmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
